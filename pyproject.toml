[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlar-data-gateway"
dynamic = ["version"]
description = "On-premise SQL access gateway for Qlar's SQL Database Reader plugin — outbound-only, no inbound ports."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Pusaka AI" }]
keywords = ["qlar", "sql", "on-premise", "database", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

# Kept deliberately small: this process runs inside someone else's network, and every
# dependency is something their security team has to accept. Database drivers are optional
# extras so an installation only pulls the one driver it actually uses.
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
sqlserver = ["pymssql>=2.3"]
oracle = ["oracledb>=2.2"]
all = ["psycopg[binary]>=3.1", "PyMySQL>=1.1", "pymssql>=2.3", "oracledb>=2.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
qlar-gateway = "qlar_data_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/pusakaai/data-gateway"
Documentation = "https://github.com/pusakaai/data-gateway/tree/main/docs"
Changelog = "https://github.com/pusakaai/data-gateway/blob/main/CHANGELOG.md"
Issues = "https://github.com/pusakaai/data-gateway/issues"

[tool.setuptools.dynamic]
version = { attr = "qlar_data_gateway.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
# S101 = assert, fine in tests; S608 = "possible SQL injection", which is the entire point of
# a module whose job is to receive SQL and hand it to a driver — the safety is in guard.py.
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
